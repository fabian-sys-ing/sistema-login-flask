<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Subir Foto de Perfil</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 20px; }
        .preview {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: #f0f0f0;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 4px solid #667eea;
        }
        .preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .preview span {
            font-size: 48px;
            color: #999;
        }
        input[type="file"] {
            margin: 20px 0;
            padding: 10px;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
            margin: 10px;
        }
        .btn-cancel {
            background: #6c757d;
        }
        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .alert-error { background: #f8d7da; color: #721c24; }
        .alert-success { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📸 Subir Foto de Perfil</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <div class="preview">
            <span>👤</span>
        </div>
        
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="foto" accept="image/*" required>
            <br>
            <button type="submit" class="btn">Subir Foto</button>
        </form>
        <a href="/perfil" class="btn btn-cancel">Cancelar</a>
        
        <p style="margin-top: 20px; color: #666; font-size: 14px;">
            Formatos permitidos: PNG, JPG, GIF<br>
            Tamaño máximo: 5MB
        </p>
    </div>
</body>
</html>
